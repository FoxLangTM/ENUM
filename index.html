    <div id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:99; justify-content:center; align-items:center;">
        <div style="background:var(--panel); padding:20px; border-radius:16px; width:80%; text-align:center; border:1px solid var(--border);">
            <p id="modal-title" style="margin-bottom:20px;">Delete code/text?</p>
            <button onclick="hideTrash()" style="background:#434246; border:none; color:white; padding:10px 20px; border-radius:8px; margin-right:10px;">Cancel</button>
            <button onclick="confirmTrash()" style="background:#ed4a4a; border:none; color:white; padding:10px 20px; border-radius:8px;">Delete</button>
        </div>
    </div>

    <main id="main-content" style="display: contents;">
        <div id="delete-wave" class="delete-wave-overlay"></div>
        <div class="editor-container">
            <div id="tab-anim" class="tab-transition-overlay"></div>
            <div id="line-marker" class="line-marker"></div>
            <div class="line-numbers" id="line-numbers" aria-hidden="true">1</div>
            <div class="editor-wrapper">
                <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
                <textarea class="editor-input" id="editor" inputmode="text" enterkeyhint="enter" spellcheck="false" autocorrect="off" autocapitalize="off" translate="no" oninput="updateText(this.value); updateLines();" aria-label="Code Editor"></textarea>
            </div>
        </div>
    </main>

    <div id="preview-container">
        <div class="drag-handle" id="preview-handle"></div>
        <iframe id="preview-frame" title="Live Preview"></iframe>
    </div>

    <footer role="contentinfo">
        <div class="fab" onclick="runPreview()" role="button" aria-label="Run Code"><i class="fa-solid fa-splotch"></i></div>
        <div class="shadow"></div>
    </footer>
    
    <section class="console-panel" id="console-panel" aria-label="Console Panel">
        <div class="console-header">
            <span><i class="fa-solid fa-terminal"></i> Console</span>
            <i class="fa-solid fa-xmark" onclick="toggleConsole()" style="cursor:pointer" role="button" aria-label="Close console"></i>
        </div>
        <div id="console-logs" class="console-logs">
            <div class="log-info" style="padding:10px;">No errors! Check preview</div>
        </div>
    </section>

    <svg style="position: absolute; width: 0; height: 0" aria-hidden="true">
        <filter id="glass" x="-50%" y="-50%" width="200%" height="200%" primitiveUnits="objectBoundingBox">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.02" result="blur"/>
            <feDisplacementMap id="disp" in="blur" in2="map" scale="0.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
    </svg>

    <div id="file-explorer" class="file-explorer" aria-label="File Explorer">
        <div class="explorer-header">PROJECT</div>
        <div id="file-list-container" class="file-list"></div>
        <div class="explorer-footer">
            <button class="btn-create-trigger" onclick="openCreateMenu()">
                <i class="fa-solid fa-plus"></i> Create
            </button>
        </div>
    </div>

    <div id="create-file-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-create-title">
        <div class="modal-content">
            <h3 id="modal-create-title">File/Folder Creation</h3>
            <input type="text" id="new-file-name" placeholder="(e.g. name.css)" aria-label="New item name">
            <select id="new-item-type" aria-label="Type of item">
                <option value="file">File</option>
                <option value="folder">Folder</option>
            </select>
            <div class="modal-buttons">
                <button onclick="closeCreateMenu()" class="btn-modal btn-cancel">Cancel</button>
                <button onclick="confirmCreateItem()" class="btn-modal btn-confirm">OK</button>
            </div>
        </div>
    </div>

    <script src="/script.js" defer></script>
</body>
</html>
